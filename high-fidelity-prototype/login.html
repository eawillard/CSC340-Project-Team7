<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LibraryPal</title>
</head>
<body>
    <header>
        <h1>LibraryPal</h1>
        <p>Connect with your local library</p>
        <nav></nav>
    </header>

    <main>
        <h2>Login</h2>

        <form>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <br><br>

            <button type="button" onclick="loginCustomer()">Sign In as Customer</button>
            <button type="button" onclick="loginProvider()">Sign In as Provider</button>


        </form>

        <p>Don't have an account?
            <a href="register.html">Create an account</a>
        </p>
    </main>

    <footer>
        <p>&copy 2026 LibraryPal</p>
    </footer>

       <script>
      function loginCustomer() {
        // Navigate to customer dashboard
        window.location.href = 'customer/dashboard.html';
      }

      function loginProvider() {
        // Navigate to provider dashboard
        window.location.href = 'provider/dashboard.html';
      }
    </script>

</body>
</html>
