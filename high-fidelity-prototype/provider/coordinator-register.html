<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="styles.css">
    <title>Register to be a LibraryPal Coordinator</title>
</head>
<body>
    <header>
    <nav>
        <a href="../index.html">LibraryPal</a>

        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="../login.html">Login</a></li>
        </ul>
    </nav>
</header>

<main>

    <h1>Create a LibraryPal Account</h1>
    <p>Register to become a LibraryPal member.</p>

    <form>

        <h2>Personal Information</h2>

        <label for="firstName">First Name</label>
        <input
            type="text"
            id="firstName"
            name="firstName"
            placeholder="John"
            required>

        <br><br>

        <label for="lastName">Last Name</label>
        <input
            type="text"
            id="lastName"
            name="lastName"
            placeholder="Doe"
            required>

        <br><br>

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="john@example.com"
            required>

        <br><br>

        <label for="phone">Phone Number</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="(555) 123-4567">

        <br><br>

        <h2>Account Information</h2>

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="johndoe"
            required>

        <br><br>

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required>

        <br><br>

        <label for="confirmPassword">Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            required>

        <br><br>

        <label>
            <input type="checkbox" required>
            I agree to the LibraryPal Terms of Service.
        </label>

        <br><br>

        <button type="submit">Create Account</button>

    </form>

    <p>
        Already have an account?
        <a href="../login.html">Login here</a>
    </p>

</main>

<footer>
    <p>&copy; 2026 LibraryPal. All rights reserved.</p>
</footer>
</body>
</html>
