<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sign up - LibraryPal</title>
</head>
<body class="account-page">

    <header>
        <h1>LibraryPal</h1>
        <p>Connect with your local library</p>
    </header>
    
    <main>
        <h2>Create an Account</h2>

        <form>
            <label for="firstname">First Name:</label>
            <input type="text" id="firstname" name="firstname" placeholder="John" required>

            <br><br>

            <label for="lastname">Last Name:</label>
            <input type="text" id="lastname" name="lastname" placeholder="Doe" required>

            <br><br>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="johndoe" required>

            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <br><br>

            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required>

            <br><br>


            <button type="submit">Register</button>
        </form>


        <p>
            Are you a library coordinator?
            <a href="provider/coordinator-register.html">Sign up as a provider</a>
        </p>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </main>

    <footer>
        <p>&copy; 2026 LibraryPal</p>
    </footer>
</body>
</html>
